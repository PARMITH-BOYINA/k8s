apiVersion: networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parmith-http-route
  namespace: parmith-ns
spec:
  parentRefs:
    - name: parmith-gateway
  ruless:
    - matches:
        - path:
            type: PathPrefix
            value: /api/fitness
      filters:
        - type: URLRewrite
          URLRewrite:
            path:
              type: ReplacePrefixMatch
              ReplacePrefixMatch: /fitness
      backendRefs:
        - name: parmith-service
          port: 5000